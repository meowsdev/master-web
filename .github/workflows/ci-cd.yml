name: CI/CD

# Only a push to main: install, typecheck, lint and build, then (if it passes) deploy to the EC2 server (PM2).
on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p .

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          # Only so the build runs here; the server builds with its own .env.
          NEXT_PUBLIC_API_URL: https://api.example.com/api/v1

  deploy:
    name: Deploy to EC2
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time; a newer push waits for the running one instead of cutting it off.
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd "${{ vars.WEB_APP_DIR }}"
            git fetch --prune origin main
            git checkout -f main
            git reset --hard origin/main
            bash scripts/deploy.sh
